<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 480" width="360" height="480">
<defs>
  <pattern id="cells" x="30" y="112" width="50" height="50" patternUnits="userSpaceOnUse">
    <rect width="25" height="25" fill="#0D1A2A"/>
    <rect x="25" width="25" height="25" fill="#0E1C2E"/>
    <rect y="25" width="25" height="25" fill="#0E1C2E"/>
    <rect x="25" y="25" width="25" height="25" fill="#0D1A2A"/>
  </pattern>
  <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
    <feGaussianBlur stdDeviation="4" result="blur"/>
    <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <filter id="glow2" x="-50%" y="-50%" width="200%" height="200%">
    <feGaussianBlur stdDeviation="6" result="blur"/>
    <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
</defs>

