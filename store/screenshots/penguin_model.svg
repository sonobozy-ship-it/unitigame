<?xml version="1.0" encoding="UTF-8"?>
<svg width="320" height="380" viewBox="0 0 320 380" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="bg" cx="50%" cy="60%">
      <stop offset="0%" stop-color="#0D2440"/>
      <stop offset="100%" stop-color="#060E1A"/>
    </radialGradient>
    <radialGradient id="bodyGrad" cx="32%" cy="30%" r="65%">
      <stop offset="0%" stop-color="#28284E"/>
      <stop offset="60%" stop-color="#141430"/>
      <stop offset="100%" stop-color="#080816"/>
    </radialGradient>
    <radialGradient id="headGrad" cx="38%" cy="32%" r="60%">
      <stop offset="0%" stop-color="#30305A"/>
      <stop offset="55%" stop-color="#141430"/>
      <stop offset="100%" stop-color="#080816"/>
    </radialGradient>
    <radialGradient id="bellyGrad" cx="40%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="70%" stop-color="#D8EEF8"/>
      <stop offset="100%" stop-color="#B0D8EC"/>
    </radialGradient>
    <radialGradient id="eyeGrad" cx="35%" cy="35%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#D0E8F4"/>
    </radialGradient>
    <radialGradient id="tileTop" cx="40%" cy="40%">
      <stop offset="0%" stop-color="#2A6A9E"/>
      <stop offset="100%" stop-color="#1A4A6E"/>
    </radialGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="320" height="380" fill="url(#bg)"/>

  <!-- Subtle grid lines in background -->
  <line x1="0" y1="190" x2="320" y2="190" stroke="#1A3A5A" stroke-width="0.5" opacity="0.4"/>
  <line x1="160" y1="0" x2="160" y2="380" stroke="#1A3A5A" stroke-width="0.5" opacity="0.4"/>

  <!-- === ISOMETRIC TILE === -->
  <!-- TW=200, TH=100, center=(160,280) -->
  <!-- Top face: diamond: top(160,230) right(260,280) bottom(160,330) left(60,280) -->

  <!-- Tile shadow -->
  <ellipse cx="160" cy="290" rx="110" ry="40" fill="#000" opacity="0.25" filter="url(#softShadow)"/>

  <!-- Tile top face -->
  <polygon points="160,230 260,280 160,330 60,280" fill="url(#tileTop)" stroke="#3A8ABE" stroke-width="1.5"/>

  <!-- Tile highlight (top-left edge) -->
  <polyline points="60,280 160,230 260,280" fill="none" stroke="#5AB4E8" stroke-width="2" opacity="0.5"/>

  <!-- Tile right face -->
  <polygon points="260,280 160,330 160,352 260,302" fill="#163A58"/>
  <!-- Tile left face -->
  <polygon points="60,280 160,330 160,352 60,302" fill="#0E2438"/>

  <!-- Ice texture on tile top -->
  <ellipse cx="130" cy="268" rx="18" ry="7" fill="white" opacity="0.06" transform="rotate(-30 130 268)"/>
  <ellipse cx="195" cy="295" rx="12" ry="5" fill="white" opacity="0.05" transform="rotate(-30 195 295)"/>

  <!-- === PENGUIN SHADOW ON TILE === -->
  <ellipse cx="162" cy="285" rx="42" ry="18" fill="#000" opacity="0.35"/>

  <!-- === PENGUIN CHARACTER === -->
  <!-- Stands centered on tile, total height ~175px -->
  <!-- Feet at y≈278, head top at y≈103 -->

  <!-- Feet (orange, behind body) -->
  <ellipse cx="148" cy="278" rx="14" ry="7" fill="#FF8C00" transform="rotate(-18 148 278)"/>
  <ellipse cx="176" cy="278" rx="14" ry="7" fill="#FF8C00" transform="rotate(18 176 278)"/>
  <!-- Toe details -->
  <line x1="141" y1="280" x2="155" y2="272" stroke="#CC6600" stroke-width="1" opacity="0.6"/>
  <line x1="169" y1="272" x2="183" y2="280" stroke="#CC6600" stroke-width="1" opacity="0.6"/>

  <!-- Left flipper (slightly behind body) -->
  <ellipse cx="114" cy="192" rx="16" ry="38" fill="#0E0E20" transform="rotate(-18 114 192)"/>
  <ellipse cx="112" cy="188" rx="9" ry="24" fill="#1A1A35" transform="rotate(-18 112 188)"/>

  <!-- BODY (main oval) -->
  <ellipse cx="162" cy="202" rx="46" ry="76" fill="url(#bodyGrad)"/>

  <!-- Body highlight -->
  <ellipse cx="148" cy="165" rx="16" ry="22" fill="white" opacity="0.06"/>

  <!-- Right flipper (in front of body) -->
  <ellipse cx="210" cy="192" rx="16" ry="38" fill="#141430" transform="rotate(18 210 192)"/>
  <ellipse cx="212" cy="188" rx="9" ry="24" fill="#1E1E40" transform="rotate(18 212 188)"/>

  <!-- WHITE BELLY -->
  <ellipse cx="164" cy="216" rx="28" ry="56" fill="url(#bellyGrad)"/>
  <!-- Belly edge shading -->
  <ellipse cx="164" cy="216" rx="28" ry="56" fill="none" stroke="#B0D4E8" stroke-width="1" opacity="0.3"/>

  <!-- === SCARF === -->
  <!-- Scarf body -->
  <ellipse cx="162" cy="152" rx="38" ry="12" fill="#E63946"/>
  <!-- Scarf front highlight -->
  <ellipse cx="162" cy="148" rx="36" ry="7" fill="#FF6B77" opacity="0.5"/>
  <!-- Scarf bottom shadow -->
  <ellipse cx="162" cy="156" rx="36" ry="7" fill="#B52030" opacity="0.4"/>
  <!-- Scarf stripe pattern -->
  <ellipse cx="162" cy="152" rx="38" ry="12" fill="none" stroke="#FF9AA2" stroke-width="2.5" stroke-dasharray="9,7" opacity="0.5"/>
  <!-- Scarf knot on side -->
  <ellipse cx="198" cy="156" rx="10" ry="8" fill="#C1121F"/>
  <ellipse cx="198" cy="154" rx="8" ry="5" fill="#E63946" opacity="0.7"/>
  <!-- Scarf tail hanging down -->
  <path d="M 196,162 Q 210,178 208,195 Q 210,205 204,200" stroke="#C1121F" stroke-width="8" fill="none" stroke-linecap="round"/>
  <path d="M 200,162 Q 218,180 216,198 Q 218,210 210,205" stroke="#E63946" stroke-width="4" fill="none" stroke-linecap="round" opacity="0.6"/>

  <!-- === HEAD === -->
  <circle cx="162" cy="125" r="42" fill="url(#headGrad)"/>
  <!-- Head highlight -->
  <ellipse cx="148" cy="108" rx="16" ry="11" fill="white" opacity="0.08"/>

  <!-- Cheek fluff (white patches on sides) -->
  <ellipse cx="138" cy="132" rx="10" ry="8" fill="white" opacity="0.12"/>
  <ellipse cx="186" cy="132" rx="10" ry="8" fill="white" opacity="0.12"/>

  <!-- === EYES === -->
  <!-- Left eye white -->
  <ellipse cx="149" cy="120" rx="14" ry="15" fill="url(#eyeGrad)"/>
  <!-- Right eye white -->
  <ellipse cx="175" cy="120" rx="14" ry="15" fill="url(#eyeGrad)"/>

  <!-- Left pupil -->
  <circle cx="151" cy="122" r="9" fill="#0A0A1E"/>
  <!-- Right pupil -->
  <circle cx="177" cy="122" r="9" fill="#0A0A1E"/>

  <!-- Left iris -->
  <circle cx="151" cy="122" r="6" fill="#1E1E40"/>
  <!-- Right iris -->
  <circle cx="177" cy="122" r="6" fill="#1E1E40"/>

  <!-- Eye shine (main) -->
  <circle cx="146" cy="117" r="3.5" fill="white"/>
  <circle cx="172" cy="117" r="3.5" fill="white"/>
  <!-- Eye shine (small) -->
  <circle cx="154" cy="127" r="1.8" fill="white" opacity="0.6"/>
  <circle cx="180" cy="127" r="1.8" fill="white" opacity="0.6"/>

  <!-- === BEAK === -->
  <!-- Upper beak -->
  <path d="M 155,136 Q 162,130 169,136 Q 165,145 162,147 Q 159,145 155,136 Z" fill="#FF8C00"/>
  <!-- Lower beak -->
  <path d="M 157,140 Q 162,148 167,140 Q 164,150 162,152 Q 160,150 157,140 Z" fill="#CC6600"/>
  <!-- Beak highlight -->
  <ellipse cx="161" cy="136" rx="4" ry="2.5" fill="#FFAA44" opacity="0.6"/>
  <!-- Beak crease -->
  <line x1="155" y1="139" x2="169" y2="139" stroke="#AA5500" stroke-width="0.8" opacity="0.5"/>

  <!-- === LABEL === -->
  <text x="160" y="368" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#5A8AB0" letter-spacing="2">1 × 1 CELL MODEL</text>
</svg>
