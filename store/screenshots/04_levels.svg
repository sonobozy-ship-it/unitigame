  <text x="540" y="72" text-anchor="middle" font-family="Arial Black,sans-serif"
        font-size="40" fill="#E8F4FF" letter-spacing="4">УРОВНИ</text>

  <!-- Difficulty legend bar -->
  <rect x="0" y="118" width="1080" height="70" fill="#081420"/>
  <circle cx="105" cy="153" r="11" fill="#82E0AA"/>
  <text x="126" y="159" font-family="Arial Black,sans-serif" font-size="24" fill="#82E0AA">Лёгкий</text>
  <circle cx="310" cy="153" r="11" fill="#F7DC6F"/>
  <text x="331" y="159" font-family="Arial Black,sans-serif" font-size="24" fill="#F7DC6F">Средний</text>
  <circle cx="540" cy="153" r="11" fill="#F0B27A"/>
  <text x="561" y="159" font-family="Arial Black,sans-serif" font-size="24" fill="#F0B27A">Сложный</text>
  <circle cx="760" cy="153" r="11" fill="#FF6B9D"/>
  <text x="781" y="159" font-family="Arial Black,sans-serif" font-size="24" fill="#FF6B9D">Эксперт</text>

