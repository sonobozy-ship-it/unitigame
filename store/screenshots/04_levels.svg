    <rect x="624" y="1180" width="184" height="152" rx="24" fill="url(#expBtn)" stroke="#3A0E20" stroke-width="1.5"/>
    <text x="716" y="1250" text-anchor="middle" font-size="42">🔒</text>
    <rect x="822" y="1180" width="220" height="152" rx="24" fill="url(#expBtn)" stroke="#3A0E20" stroke-width="1.5"/>
    <text x="932" y="1250" text-anchor="middle" font-size="42">🔒</text>
  </g>

  <!-- ── PROGRESS SECTION ── -->
  <rect x="50" y="1370" width="980" height="280" rx="32" fill="#0A1820" stroke="#1E3A55" stroke-width="1.5"/>
