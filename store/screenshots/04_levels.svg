    <text x="320" y="770" text-anchor="middle" font-size="42">🔒</text>
    <text x="320" y="816" text-anchor="middle" font-family="Arial Black,sans-serif" font-size="26" fill="#C8A840">42</text>
    <rect x="426" y="700" width="184" height="152" rx="24" fill="url(#medBtn)" stroke="#3A2C10" stroke-width="1.5"/>
    <text x="518" y="770" text-anchor="middle" font-size="42">🔒</text>
    <text x="518" y="816" text-anchor="middle" font-family="Arial Black,sans-serif" font-size="26" fill="#C8A840">43</text>
    <rect x="624" y="700" width="184" height="152" rx="24" fill="url(#medBtn)" stroke="#3A2C10" stroke-width="1.5"/>
    <text x="716" y="770" text-anchor="middle" font-size="42">🔒</text>
    <text x="716" y="816" text-anchor="middle" font-family="Arial Black,sans-serif" font-size="26" fill="#C8A840">44</text>
    <rect x="822" y="700" width="220" height="152" rx="24" fill="url(#medBtn)" stroke="#3A2C10" stroke-width="1.5"/>
