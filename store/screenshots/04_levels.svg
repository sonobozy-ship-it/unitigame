  <circle cx="34" cy="658" r="11" fill="#F7DC6F"/>
  <text x="56" y="664" font-family="Arial Black,sans-serif" font-size="26" fill="#F7DC6F" letter-spacing="2">СРЕДНИЙ — уровни 41–100</text>

