<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1920" viewBox="0 0 1080 1920">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#020810"/>
      <stop offset="50%" stop-color="#060E1A"/>
      <stop offset="100%" stop-color="#0D1B2A"/>
    </linearGradient>
    <linearGradient id="aur1" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="#00C896" stop-opacity="0"/>
      <stop offset="40%"  stop-color="#00C896" stop-opacity="0.18"/>
      <stop offset="70%"  stop-color="#0096C8" stop-opacity="0.14"/>
      <stop offset="100%" stop-color="#0096C8" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1A304A"/>
      <stop offset="100%" stop-color="#0C1C2C"/>
    </linearGradient>
    <linearGradient id="headerGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#142030"/>
      <stop offset="100%" stop-color="#0A1620"/>
    </linearGradient>
    <radialGradient id="starGrad" cx="30%" cy="20%" r="75%">
      <stop offset="0%" stop-color="#FFEF88"/>
      <stop offset="50%" stop-color="#FFD700"/>
      <stop offset="100%" stop-color="#C87800"/>
    </radialGradient>
    <!-- Level button gradients by difficulty -->
    <linearGradient id="easyBtn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1E3A22"/>
      <stop offset="100%" stop-color="#0E2012"/>
    </linearGradient>
    <linearGradient id="medBtn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3A2C10"/>
      <stop offset="100%" stop-color="#201808"/>
    </linearGradient>
    <linearGradient id="hardBtn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3A1E10"/>
      <stop offset="100%" stop-color="#201008"/>
    </linearGradient>
    <linearGradient id="expBtn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3A0E20"/>
      <stop offset="100%" stop-color="#200810"/>
    </linearGradient>
    <filter id="activeBtnGlow" x="-15%" y="-15%" width="130%" height="130%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="8" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="headerShadow">
      <feDropShadow dx="0" dy="4" stdDeviation="12" flood-color="#000" flood-opacity="0.6"/>
    </filter>
    <filter id="progressGlow" x="-5%" y="-100%" width="110%" height="300%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="6" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1080" height="1920" fill="url(#sky)"/>
  <!-- Stars -->
  <circle cx="80"  cy="220" r="1.5" fill="white" opacity="0.5"/>
  <circle cx="340" cy="160" r="1"   fill="white" opacity="0.4"/>
  <circle cx="760" cy="190" r="1.5" fill="white" opacity="0.6"/>
  <circle cx="980" cy="240" r="1"   fill="white" opacity="0.4"/>
  <!-- Aurora -->
  <path d="M-100,600 Q300,500 540,530 Q780,560 1180,480" stroke="url(#aur1)" stroke-width="70" fill="none"/>

  <!-- ── HEADER ── -->
