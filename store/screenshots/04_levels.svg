  <text x="56" y="222" font-family="Arial Black,sans-serif" font-size="26" fill="#82E0AA" letter-spacing="2">ЛЁГКИЙ — уровни 1–40</text>

  <!-- Easy level grid (levels 1–5) -->
  <!-- Level 1 — 3 stars (gold border) -->
  <g filter="url(#activeBtnGlow)">
    <rect x="30"  y="258" width="184" height="184" rx="24" fill="url(#easyBtn)" stroke="#FFD700" stroke-width="2.5"/>
  </g>
  <text x="122" y="332" text-anchor="middle" font-family="Arial Black,sans-serif" font-size="52" fill="#F0FFF0">1</text>
  <text x="88"  y="374" font-family="serif" font-size="28" fill="#FFD700">★</text>
  <text x="114" y="374" font-family="serif" font-size="28" fill="#FFD700">★</text>
  <text x="140" y="374" font-family="serif" font-size="28" fill="#FFD700">★</text>
  <text x="122" y="418" text-anchor="middle" font-family="Arial,sans-serif" font-size="20" fill="#4A9A60">Лёгкий</text>

  <!-- Level 2 — 3 stars -->
  <g filter="url(#activeBtnGlow)">
    <rect x="228" y="258" width="184" height="184" rx="24" fill="url(#easyBtn)" stroke="#FFD700" stroke-width="2.5"/>
  </g>
  <text x="320" y="332" text-anchor="middle" font-family="Arial Black,sans-serif" font-size="52" fill="#F0FFF0">2</text>
  <text x="286" y="374" font-family="serif" font-size="28" fill="#FFD700">★</text>
  <text x="312" y="374" font-family="serif" font-size="28" fill="#FFD700">★</text>
  <text x="338" y="374" font-family="serif" font-size="28" fill="#FFD700">★</text>
  <text x="320" y="418" text-anchor="middle" font-family="Arial,sans-serif" font-size="20" fill="#4A9A60">Лёгкий</text>

