    <text x="122" y="1056" text-anchor="middle" font-family="Arial Black,sans-serif" font-size="26" fill="#C07050">101</text>
    <rect x="228" y="940" width="184" height="152" rx="24" fill="url(#hardBtn)" stroke="#3A1E10" stroke-width="1.5"/>
    <text x="320" y="1010" text-anchor="middle" font-size="42">🔒</text>
    <text x="320" y="1056" text-anchor="middle" font-family="Arial Black,sans-serif" font-size="26" fill="#C07050">102</text>
    <rect x="426" y="940" width="184" height="152" rx="24" fill="url(#hardBtn)" stroke="#3A1E10" stroke-width="1.5"/>
    <text x="518" y="1010" text-anchor="middle" font-size="42">🔒</text>
    <text x="518" y="1056" text-anchor="middle" font-family="Arial Black,sans-serif" font-size="26" fill="#C07050">103</text>
    <rect x="624" y="940" width="184" height="152" rx="24" fill="url(#hardBtn)" stroke="#3A1E10" stroke-width="1.5"/>
    <text x="716" y="1010" text-anchor="middle" font-size="42">🔒</text>
    <text x="716" y="1056" text-anchor="middle" font-family="Arial Black,sans-serif" font-size="26" fill="#C07050">104</text>
    <rect x="822" y="940" width="220" height="152" rx="24" fill="url(#hardBtn)" stroke="#3A1E10" stroke-width="1.5"/>
