  <circle cx="34" cy="898" r="11" fill="#F0B27A"/>
  <text x="56" y="904" font-family="Arial Black,sans-serif" font-size="26" fill="#F0B27A" letter-spacing="2">СЛОЖНЫЙ — уровни 101–150</text>

