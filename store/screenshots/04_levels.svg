  <text x="518" y="575" text-anchor="middle" font-family="Arial,sans-serif" font-size="22" fill="#1A3A55">8</text>
  <rect x="624" y="460" width="184" height="152" rx="24" fill="#0A1420" stroke="#102030" stroke-width="1.5"/>
  <text x="716" y="532" text-anchor="middle" font-size="46">🔒</text>
  <text x="716" y="575" text-anchor="middle" font-family="Arial,sans-serif" font-size="22" fill="#1A3A55">9</text>
  <rect x="822" y="460" width="220" height="152" rx="24" fill="#0A1420" stroke="#102030" stroke-width="1.5"/>
  <text x="932" y="532" text-anchor="middle" font-size="46">🔒</text>
  <text x="932" y="575" text-anchor="middle" font-family="Arial,sans-serif" font-size="22" fill="#1A3A55">10</text>

