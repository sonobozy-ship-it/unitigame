  <rect x="426" y="258" width="184" height="184" rx="24" fill="url(#easyBtn)" stroke="#FFD700" stroke-width="1.5"/>
  <text x="518" y="332" text-anchor="middle" font-family="Arial Black,sans-serif" font-size="52" fill="#F0FFF0">3</text>
  <text x="484" y="374" font-family="serif" font-size="28" fill="#FFD700">★</text>
  <text x="510" y="374" font-family="serif" font-size="28" fill="#FFD700">★</text>
  <text x="536" y="374" font-family="serif" font-size="28" fill="#1E3A55">★</text>
  <text x="518" y="418" text-anchor="middle" font-family="Arial,sans-serif" font-size="20" fill="#4A9A60">Лёгкий</text>

  <!-- Level 4 — 1 star -->
  <rect x="624" y="258" width="184" height="184" rx="24" fill="url(#easyBtn)" stroke="#FFD700" stroke-width="1.5"/>
  <text x="716" y="332" text-anchor="middle" font-family="Arial Black,sans-serif" font-size="52" fill="#F0FFF0">4</text>
  <text x="682" y="374" font-family="serif" font-size="28" fill="#FFD700">★</text>
  <text x="708" y="374" font-family="serif" font-size="28" fill="#1E3A55">★</text>
  <text x="734" y="374" font-family="serif" font-size="28" fill="#1E3A55">★</text>
  <text x="716" y="418" text-anchor="middle" font-family="Arial,sans-serif" font-size="20" fill="#4A9A60">Лёгкий</text>

