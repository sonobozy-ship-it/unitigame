<?xml version="1.0" encoding="UTF-8"?>
<svg width="390" height="700" viewBox="0 0 390 700" xmlns="http://www.w3.org/2000/svg">
<defs>
  <!-- Snake body gradients -->
  <linearGradient id="gGold" x1="0%" y1="0%" x2="100%" y2="100%">
    <stop offset="0%" stop-color="#FFE94D"/><stop offset="100%" stop-color="#CC8800"/>
  </linearGradient>
  <linearGradient id="gRed" x1="0%" y1="0%" x2="100%" y2="100%">
    <stop offset="0%" stop-color="#FF5566"/><stop offset="100%" stop-color="#CC1122"/>
  </linearGradient>
  <linearGradient id="gBlue" x1="0%" y1="0%" x2="100%" y2="100%">
    <stop offset="0%" stop-color="#55AAFF"/><stop offset="100%" stop-color="#1166CC"/>
  </linearGradient>
  <linearGradient id="gGreen" x1="0%" y1="0%" x2="100%" y2="100%">
    <stop offset="0%" stop-color="#44EE88"/><stop offset="100%" stop-color="#008844"/>
  </linearGradient>
  <linearGradient id="gPurple" x1="0%" y1="0%" x2="100%" y2="100%">
    <stop offset="0%" stop-color="#BB66FF"/><stop offset="100%" stop-color="#6600CC"/>
  </linearGradient>
  <linearGradient id="gOrange" x1="0%" y1="0%" x2="100%" y2="100%">
    <stop offset="0%" stop-color="#FF9944"/><stop offset="100%" stop-color="#CC5500"/>
  </linearGradient>
  <linearGradient id="gTeal" x1="0%" y1="0%" x2="100%" y2="100%">
    <stop offset="0%" stop-color="#22DDCC"/><stop offset="100%" stop-color="#008877"/>
  </linearGradient>

  <!-- Glow filters -->
  <filter id="glowGold" x="-30%" y="-30%" width="160%" height="160%">
    <feGaussianBlur stdDeviation="5" result="b"/>
    <feFlood flood-color="#FFD700" flood-opacity="0.6" result="c"/>
    <feComposite in="c" in2="b" operator="in" result="g"/>
    <feMerge><feMergeNode in="g"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <filter id="glowColor" x="-20%" y="-20%" width="140%" height="140%">
    <feGaussianBlur stdDeviation="3" result="b"/>
    <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>

  <!-- Background gradient -->
  <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
    <stop offset="0%" stop-color="#080E1C"/>
    <stop offset="100%" stop-color="#0D1628"/>
  </linearGradient>
</defs>

