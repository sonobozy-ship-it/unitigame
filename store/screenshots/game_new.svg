<line x1="164" y1="367" x2="157" y2="361" stroke="#FF2255" stroke-width="2" stroke-linecap="round"/>
<line x1="164" y1="367" x2="157" y2="373" stroke="#FF2255" stroke-width="2" stroke-linecap="round"/>

