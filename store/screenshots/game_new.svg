<line x1="265" y1="398" x2="259" y2="406" stroke="#FF2255" stroke-width="2" stroke-linecap="round"/>
<line x1="265" y1="398" x2="271" y2="406" stroke="#FF2255" stroke-width="2" stroke-linecap="round"/>

