<circle cx="125" cy="297" r="30" fill="white" opacity="0.05"/>
<circle cx="125" cy="297" r="30" fill="none" stroke="white" stroke-width="1.5" stroke-dasharray="5,4" opacity="0.25"/>
<text x="125" y="302" text-anchor="middle" font-family="Arial" font-size="11" fill="white" opacity="0.45">tap</text>

<!-- ── CONTROLS ── -->
<rect x="0" y="484" width="390" height="1" fill="#1A3050"/>
<rect x="14" y="494" width="116" height="42" rx="12" fill="#0E1A2C" stroke="#1E3A70" stroke-width="1.5"/>
