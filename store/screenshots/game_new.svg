<polyline points="125,437 125,367 125,297"
  stroke="#BB66FF" stroke-width="50" stroke-linecap="round" stroke-linejoin="round" fill="none"
  filter="url(#sf)"/>
<polyline points="125,437 125,367 125,297"
  stroke="#DD99FF" stroke-width="28" stroke-linecap="round" stroke-linejoin="round" fill="none" opacity="0.3"/>
<line x1="108" y1="402" x2="142" y2="402" stroke="#7700CC" stroke-width="1.2" opacity="0.5"/>
<line x1="108" y1="332" x2="142" y2="332" stroke="#7700CC" stroke-width="1.2" opacity="0.5"/>
<!-- Head at (2,1)=125,297: eyes up -->
<circle cx="113" cy="282" r="7"  fill="white"/>
<circle cx="137" cy="282" r="7"  fill="white"/>
<circle cx="114" cy="283" r="4"  fill="#111"/>
<circle cx="138" cy="283" r="4"  fill="#111"/>
<circle cx="112" cy="281" r="1.8" fill="white"/>
<circle cx="136" cy="281" r="1.8" fill="white"/>
