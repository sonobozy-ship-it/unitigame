<circle cx="253" cy="382" r="7"  fill="white"/>
<circle cx="277" cy="382" r="7"  fill="white"/>
<circle cx="253" cy="383" r="4"  fill="#111"/>
<circle cx="277" cy="383" r="4"  fill="#111"/>
<circle cx="252" cy="381" r="1.8" fill="white"/>
<circle cx="276" cy="381" r="1.8" fill="white"/>
