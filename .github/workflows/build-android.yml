name: Build Android APK

on:
  push:
    branches:
      - main
      - master
      - dev
      - claude/casual-game-levels-TuCmm
  workflow_dispatch:        # позволяет запускать вручную из GitHub UI

jobs:
  build:
    name: Build APK (EAS)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Setup EAS CLI
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Build APK
        run: eas build --platform android --profile preview --non-interactive

      - name: Get APK download URL
        run: |
          echo "✅ Build complete!"
          echo "📲 Download APK from: https://expo.dev"
          echo "Or run: eas build:list to see the latest build URL"
