name: Build Android APK

on:
  push:
    branches:
      - main
      - master
      - dev
      - claude/casual-game-levels-TuCmm
  workflow_dispatch:
    inputs:
      app:
        description: 'App to build (koru or waddle)'
        required: true
        default: 'koru'

jobs:
  build-koru:
    name: Build KORU APK
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/koru

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: apps/koru/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Setup Expo + EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.KORU_PUZZLE }}

      - name: Build APK
        run: eas build --platform android --profile preview --non-interactive

  build-waddle:
    name: Build WADDLE APK
    runs-on: ubuntu-latest
    # WADDLE needs 'eas init' run once locally to get a real projectId
    # Until then this job is skipped to not block KORU
    if: false
    defaults:
      run:
        working-directory: apps/movo

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: apps/movo/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Setup Expo + EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.KORU_PUZZLE }}

      - name: Build APK
        run: eas build --platform android --profile preview --non-interactive
