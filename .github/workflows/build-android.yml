name: Build Android APK

on:
  push:
    branches:
      - main
      - master
      - dev
      - claude/casual-game-levels-TuCmm
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    name: Build APK (EAS)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Decode keystore
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > koru-release.keystore
          echo "✅ Keystore decoded"

      - name: Setup EAS CLI
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.KORU_PUZZLE }}

      - name: Build APK with signing
        run: |
          eas build \
            --platform android \
            --profile preview \
            --non-interactive
        env:
          KEYSTORE_PATH: ./koru-release.keystore
          KEYSTORE_ALIAS: koru-key
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
