<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>KORU — 3D Preview</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body { background:#0A0A14; overflow:hidden; font-family:system-ui,sans-serif; }
  #info {
    position:fixed; top:0; left:0; right:0; z-index:10;
    display:flex; align-items:center; justify-content:space-between;
    padding:14px 20px;
    background:linear-gradient(to bottom,rgba(10,10,20,0.95),transparent);
  }
  #logo { font-size:24px; font-weight:900; color:#3ECFB2; letter-spacing:4px; }
  #hud  { font-size:13px; color:#3ECFB2; font-weight:700;
          background:rgba(62,207,178,0.12); border:1px solid #3ECFB2;
          border-radius:20px; padding:6px 16px; letter-spacing:1px; }
  #hint { position:fixed; bottom:80px; left:50%; transform:translateX(-50%);
          color:#6B6B8A; font-size:12px; letter-spacing:1px;
          background:rgba(10,10,20,0.8); padding:6px 16px; border-radius:20px; }
  #controls {
    position:fixed; bottom:20px; left:50%; transform:translateX(-50%);
    display:flex; gap:10px;
  }
  .btn {
    background:rgba(62,207,178,0.12); border:1px solid #3ECFB2;
    color:#3ECFB2; border-radius:12px; padding:10px 20px;
    font-size:13px; font-weight:700; cursor:pointer; letter-spacing:1px;
  }
  .btn:active { background:rgba(62,207,178,0.3); }
  #win-overlay {
    display:none; position:fixed; inset:0; z-index:20;
    background:rgba(10,10,20,0.85);
    flex-direction:column; align-items:center; justify-content:center; gap:16px;
  }
  #win-overlay.show { display:flex; }
  #win-trophy { font-size:72px; }
  #win-title  { font-size:28px; font-weight:900; color:#E8E6F0; }
  #win-stars  { font-size:40px; color:#FFB347; letter-spacing:4px; }
  #win-btn    { background:#3ECFB2; color:#0A0A14; border:none; border-radius:14px;
                padding:14px 40px; font-size:16px; font-weight:900; cursor:pointer; margin-top:8px; }
</style>
</head>
<body>

<div id="info">
  <div id="logo">KORU</div>
  <div id="hud">0 moves · 0%</div>
</div>

<div id="hint">DRAG from a dot to draw · DRAG empty space to rotate</div>

<div id="controls">
  <div class="btn" onclick="resetLevel()">🔄 Reset</div>
  <div class="btn" onclick="nextLevel()">Next ›</div>
</div>

<div id="win-overlay">
  <div id="win-trophy">🏆</div>
  <div id="win-title">Level Complete!</div>
  <div id="win-stars">★★★</div>
  <button id="win-btn" onclick="nextLevel()">Next Level ›</button>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
// ── Levels ────────────────────────────────────────────────────────────────────
const LEVELS = [
  { size:5, par:12, dots:[
    {color:'red',   start:[0,0], end:[4,4]},
    {color:'blue',  start:[0,4], end:[4,0]},
    {color:'green', start:[2,0], end:[2,4]},
  ]},
  { size:5, par:16, dots:[
    {color:'red',    start:[0,0], end:[3,3]},
    {color:'blue',   start:[0,4], end:[4,0]},
    {color:'green',  start:[4,4], end:[1,1]},
    {color:'yellow', start:[0,2], end:[4,2]},
  ]},
  { size:6, par:22, dots:[
    {color:'red',    start:[0,0], end:[5,5]},
    {color:'blue',   start:[0,5], end:[5,0]},
    {color:'green',  start:[0,2], end:[5,3]},
    {color:'yellow', start:[2,0], end:[3,5]},
    {color:'orange', start:[1,3], end:[4,2]},
  ]},
  { size:6, par:26, dots:[
    {color:'red',    start:[0,0], end:[2,4]},
    {color:'blue',   start:[0,3], end:[5,5]},
    {color:'green',  start:[0,5], end:[4,1]},
    {color:'yellow', start:[2,0], end:[5,3]},
    {color:'orange', start:[1,2], end:[4,4]},
    {color:'purple', start:[3,1], end:[5,1]},
  ]},
];

const COLORS = {
  red:0xFF3B3B, blue:0x3B8EFF, green:0x2ECC71,
  yellow:0xFFD600, orange:0xFF8C00, purple:0xA855F7,
  cyan:0x00D4FF, pink:0xFF69B4,
};

// ── Three.js ──────────────────────────────────────────────────────────────────
const scene    = new THREE.Scene();
scene.background = new THREE.Color(0x0A0A14);
scene.fog = new THREE.FogExp2(0x0A0A14, 0.03);

const renderer = new THREE.WebGLRenderer({antialias:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.setSize(innerWidth, innerHeight);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.3;
document.body.appendChild(renderer.domElement);

const camera = new THREE.PerspectiveCamera(50, innerWidth/innerHeight, 0.1, 200);
camera.position.set(0,10,10);
camera.lookAt(0,0,0);

scene.add(new THREE.AmbientLight(0x222244, 3));
const dir = new THREE.DirectionalLight(0xffffff, 1.5);
dir.position.set(5,10,5);
scene.add(dir);

const CS = 1.1;  // cell size
let levelGroup, cellMeshes=[], grid=[], pipes={}, moves=0, dragging=null;
let currentLevelIdx = 0;

function gMat(hex) {
  const c = new THREE.Color(hex);
  return new THREE.MeshStandardMaterial({
    color:c, emissive:c, emissiveIntensity:1.8,
    roughness:0.1, metalness:0.8,
  });
}

function buildLevel(lvl) {
  moves=0; dragging=null; pipes={}; cellMeshes=[];
  grid = Array.from({length:lvl.size},()=>Array(lvl.size).fill(null));
  if(levelGroup){ scene.remove(levelGroup); }
  levelGroup = new THREE.Group();
  scene.add(levelGroup);

  const n=lvl.size, off=-(n-1)*CS/2;

  // Platform
  const plat = new THREE.Mesh(
    new THREE.BoxGeometry(n*CS+0.8, 0.18, n*CS+0.8),
    new THREE.MeshStandardMaterial({color:0x13131F,emissive:0x0a0a1a,emissiveIntensity:0.4,roughness:0.2,metalness:0.95})
  );
  plat.position.y=-0.12;
  levelGroup.add(plat);

  // Neon edge
  const edge = new THREE.Mesh(
    new THREE.BoxGeometry(n*CS+0.82, 0.06, n*CS+0.82),
    new THREE.MeshStandardMaterial({color:0x3ECFB2,emissive:0x3ECFB2,emissiveIntensity:1.5})
  );
  edge.position.y=-0.03;
  levelGroup.add(edge);

  // Corner lights
  for(const [cr,cc] of [[-1,-1],[-1,1],[1,-1],[1,1]]) {
    const pl = new THREE.PointLight(0x3ECFB2, 1.5, n*CS*1.2);
    pl.position.set(cr*(n*CS/2+0.5), 0.5, cc*(n*CS/2+0.5));
    levelGroup.add(pl);
  }

  // Cells
  for(let r=0;r<n;r++){
    cellMeshes[r]=[];
    for(let c=0;c<n;c++){
      const m = new THREE.Mesh(
        new THREE.BoxGeometry(CS*0.88,0.1,CS*0.88),
        new THREE.MeshStandardMaterial({color:0x16213e,emissive:0x0a1020,emissiveIntensity:0.3,roughness:0.3,metalness:0.7})
      );
      m.position.set(off+c*CS, 0, off+r*CS);
      m.userData={r,c};
      levelGroup.add(m);
      cellMeshes[r][c]=m;
    }
  }

  // Grid lines
  const lm = new THREE.LineBasicMaterial({color:0x1a2040,transparent:true,opacity:0.4});
  for(let i=0;i<=n;i++){
    const x=off-CS/2+i*CS, z0=off-CS/2, z1=z0+n*CS;
    [[x,z0,x,z1],[z0,x,z1,x]].forEach(([x1,z1_,x2,z2])=>{
      const g=new THREE.BufferGeometry().setFromPoints([
        new THREE.Vector3(x1,0.07,z1_),new THREE.Vector3(x2,0.07,z2)
      ]);
      levelGroup.add(new THREE.Line(g,lm));
    });
  }

  // Dots
  for(const dot of lvl.dots){
    grid[dot.start[0]][dot.start[1]]=dot.color;
    grid[dot.end[0]][dot.end[1]]=dot.color;
    pipes[dot.color]={cells:[dot.start],completed:false,tubeGroup:null};
    [dot.start,dot.end].forEach(pos=>spawnDot(pos,dot.color,off));
  }

  const d=n*CS*1.6;
  camera.position.set(0,d*0.85,d);
  camera.lookAt(0,0,0);
  updateHUD(lvl);
}

function spawnDot([r,c],color,off){
  const col=new THREE.Color(COLORS[color]??0xffffff);
  const x=off+c*CS, z=off+r*CS;
  // Sphere
  const s=new THREE.Mesh(new THREE.SphereGeometry(0.3,20,20),gMat(COLORS[color]));
  s.position.set(x,0.38,z);
  levelGroup.add(s);
  // Ring
  const ring=new THREE.Mesh(new THREE.TorusGeometry(0.42,0.05,8,32),gMat(COLORS[color]));
  ring.position.set(x,0.38,z); ring.rotation.x=Math.PI/2;
  levelGroup.add(ring);
  // Light
  const pl=new THREE.PointLight(col,3,3.5);
  pl.position.set(x,0.5,z);
  levelGroup.add(pl);
}

function rebuildTube(color){
  const pipe=pipes[color]; if(!pipe) return;
  if(pipe.tubeGroup){levelGroup.remove(pipe.tubeGroup);}
  if(pipe.cells.length<2){pipe.tubeGroup=null;return;}
  const n=LEVELS[currentLevelIdx].size, off=-(n-1)*CS/2;
  const col=new THREE.Color(COLORS[color]??0xffffff);
  const g=new THREE.Group();
  const pts=pipe.cells.map(([r,c])=>new THREE.Vector3(off+c*CS,0.3,off+r*CS));
  const curve=new THREE.CatmullRomCurve3(pts);
  const segs=pipe.cells.length*10;
  // Core tube
  g.add(new THREE.Mesh(new THREE.TubeGeometry(curve,segs,0.19,8,false),gMat(COLORS[color])));
  // Glow halo
  const hm=new THREE.MeshStandardMaterial({color:col,emissive:col,emissiveIntensity:0.5,transparent:true,opacity:0.15});
  g.add(new THREE.Mesh(new THREE.TubeGeometry(curve,segs,0.32,8,false),hm));
  levelGroup.add(g);
  pipe.tubeGroup=g;
}

function setCellGlow(r,c,color){
  const m=cellMeshes[r]?.[c]; if(!m)return;
  if(color){
    const col=new THREE.Color(COLORS[color]??0xffffff);
    m.material.color.copy(col).multiplyScalar(0.15);
    m.material.emissive.copy(col).multiplyScalar(0.1);
  } else {
    m.material.color.set(0x16213e);
    m.material.emissive.set(0x0a1020);
  }
}

function isDot([r,c]){
  const lvl=LEVELS[currentLevelIdx];
  for(const d of lvl.dots){
    if(d.start[0]===r&&d.start[1]===c) return d.color;
    if(d.end[0]===r&&d.end[1]===c) return d.color;
  }
  return null;
}

// ── Raycast ───────────────────────────────────────────────────────────────────
const ray=new THREE.Raycaster();
const plane=new THREE.Plane(new THREE.Vector3(0,1,0),0);

function toCell(cx,cy){
  const lvl=LEVELS[currentLevelIdx];
  ray.setFromCamera(new THREE.Vector2(cx/innerWidth*2-1,-(cy/innerHeight)*2+1),camera);
  const pt=new THREE.Vector3();
  if(!ray.ray.intersectPlane(plane,pt)) return null;
  const n=lvl.size, off=-(n-1)*CS/2;
  const col=Math.round((pt.x-off)/CS), row=Math.round((pt.z-off)/CS);
  if(row<0||row>=n||col<0||col>=n) return null;
  return [row,col];
}

function isAdj([r1,c1],[r2,c2]){return Math.abs(r1-r2)+Math.abs(c1-c2)===1;}

function startDrag(cell){
  const dc=isDot(cell), cc=grid[cell[0]][cell[1]];
  const color=dc??cc; if(!color||!pipes[color]) return;
  dragging=color;
  const pipe=pipes[color];
  for(const [r,c] of pipe.cells) if(!isDot([r,c])){grid[r][c]=null;setCellGlow(r,c,null);}
  pipe.cells=[cell]; pipe.completed=false;
  grid[cell[0]][cell[1]]=color; setCellGlow(cell[0],cell[1],color);
  rebuildTube(color);
}

function contDrag(cell){
  if(!dragging) return;
  const pipe=pipes[dragging];
  const last=pipe.cells[pipe.cells.length-1];
  if(last[0]===cell[0]&&last[1]===cell[1]) return;
  if(!isAdj(last,cell)) return;
  // backtrack
  if(pipe.cells.length>=2){
    const prev=pipe.cells[pipe.cells.length-2];
    if(prev[0]===cell[0]&&prev[1]===cell[1]){
      const rem=pipe.cells.pop();
      if(!isDot(rem)){grid[rem[0]][rem[1]]=null;setCellGlow(rem[0],rem[1],null);}
      rebuildTube(dragging); updateHUD(LEVELS[currentLevelIdx]); return;
    }
  }
  const ex=grid[cell[0]][cell[1]];
  if(ex&&ex!==dragging) return;
  if(pipe.cells.some(([r,c])=>r===cell[0]&&c===cell[1])) return;
  pipe.cells.push(cell); grid[cell[0]][cell[1]]=dragging;
  setCellGlow(cell[0],cell[1],dragging); moves++;
  const lvl=LEVELS[currentLevelIdx];
  const dot=lvl.dots.find(d=>d.color===dragging);
  const isEnd=(dot.end[0]===cell[0]&&dot.end[1]===cell[1])||
              (dot.start[0]===cell[0]&&dot.start[1]===cell[1]&&pipe.cells.length>1);
  if(isEnd){pipe.completed=true;dragging=null;}
  rebuildTube(pipe.color??dragging??Object.keys(pipes).find(k=>pipes[k]===pipe));
  updateHUD(lvl); checkWin(lvl);
}

function checkWin(lvl){
  if(!lvl.dots.every(d=>pipes[d.color]?.completed)) return;
  if(grid.flat().filter(Boolean).length!==lvl.size*lvl.size) return;
  // Flash all tubes
  Object.values(pipes).forEach(p=>p.tubeGroup?.traverse(m=>{
    if(m.material?.emissiveIntensity) m.material.emissiveIntensity=5;
  }));
  const stars=moves<=lvl.par?3:moves<=lvl.par*1.5?2:1;
  document.getElementById('win-stars').textContent='★'.repeat(stars)+'☆'.repeat(3-stars);
  setTimeout(()=>document.getElementById('win-overlay').classList.add('show'),400);
}

function updateHUD(lvl){
  const total=lvl.size*lvl.size;
  const filled=grid.flat().filter(Boolean).length;
  document.getElementById('hud').textContent=`${moves} moves · ${Math.round(filled/total*100)}%`;
}

function resetLevel(){
  document.getElementById('win-overlay').classList.remove('show');
  buildLevel(LEVELS[currentLevelIdx]);
}

function nextLevel(){
  document.getElementById('win-overlay').classList.remove('show');
  currentLevelIdx=(currentLevelIdx+1)%LEVELS.length;
  buildLevel(LEVELS[currentLevelIdx]);
}

// ── Orbit ─────────────────────────────────────────────────────────────────────
let theta=0.5, phi=0.72, orbitStart=null;
let touchMode=null, lastCell=null;

function updateCam(){
  const lvl=LEVELS[currentLevelIdx], r=lvl.size*CS*1.6;
  camera.position.set(r*Math.sin(theta)*Math.cos(phi),r*Math.sin(phi),r*Math.cos(theta)*Math.cos(phi));
  camera.lookAt(0,0,0);
}

renderer.domElement.addEventListener('mousedown',e=>{
  const cell=toCell(e.clientX,e.clientY);
  if(cell&&(isDot(cell)||grid[cell[0]][cell[1]])){
    touchMode='draw'; startDrag(cell);
  } else {
    touchMode='orbit'; orbitStart={theta,phi,x:e.clientX,y:e.clientY};
  }
});
renderer.domElement.addEventListener('mousemove',e=>{
  if(touchMode==='draw'){
    const cell=toCell(e.clientX,e.clientY);
    if(cell&&(!lastCell||cell[0]!==lastCell[0]||cell[1]!==lastCell[1])){
      lastCell=cell; contDrag(cell);
    }
  } else if(touchMode==='orbit'&&orbitStart){
    theta=orbitStart.theta-(e.clientX-orbitStart.x)/innerWidth*3;
    phi=Math.max(0.25,Math.min(1.15,orbitStart.phi+(e.clientY-orbitStart.y)/innerHeight*2));
    updateCam();
  }
});
renderer.domElement.addEventListener('mouseup',()=>{touchMode=null;dragging=null;lastCell=null;});

renderer.domElement.addEventListener('touchstart',e=>{
  const t=e.touches[0];
  const cell=toCell(t.clientX,t.clientY);
  if(cell&&(isDot(cell)||grid[cell[0]][cell[1]])){
    touchMode='draw'; startDrag(cell);
  } else {
    touchMode='orbit'; orbitStart={theta,phi,x:t.clientX,y:t.clientY};
  }
},{passive:true});
renderer.domElement.addEventListener('touchmove',e=>{
  e.preventDefault();
  const t=e.touches[0];
  if(touchMode==='draw'){
    const cell=toCell(t.clientX,t.clientY);
    if(cell&&(!lastCell||cell[0]!==lastCell[0]||cell[1]!==lastCell[1])){lastCell=cell;contDrag(cell);}
  } else if(touchMode==='orbit'&&orbitStart){
    theta=orbitStart.theta-(t.clientX-orbitStart.x)/innerWidth*3;
    phi=Math.max(0.25,Math.min(1.15,orbitStart.phi+(t.clientY-orbitStart.y)/innerHeight*2));
    updateCam();
  }
},{passive:false});
renderer.domElement.addEventListener('touchend',()=>{touchMode=null;dragging=null;lastCell=null;},{passive:true});

window.addEventListener('resize',()=>{
  renderer.setSize(innerWidth,innerHeight);
  camera.aspect=innerWidth/innerHeight;
  camera.updateProjectionMatrix();
});

// ── Render loop ───────────────────────────────────────────────────────────────
function animate(ts){
  requestAnimationFrame(animate);
  // Slow auto-rotate when idle
  if(!touchMode){ theta+=0.003; updateCam(); }
  renderer.render(scene,camera);
}

buildLevel(LEVELS[0]);
animate(0);
</script>
</body>
</html>
